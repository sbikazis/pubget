name: Deploy Hosting
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in lockstep with build.yml: the pinned `pdfrx_engine` only
          # compiles on the Flutter/Dart line this project is locked against.
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Install pinned Firebase CLI
        run: |
          npm install --global firebase-tools@15.28.2
          node --version
          npm --version
          version="$(firebase --version)"
          test "$version" = "15.28.2"

      - name: Deploy to Firebase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          umask 077
          credential_file="$(mktemp)"
          trap 'rm -f "$credential_file"' EXIT

          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$credential_file"
          node -e '
            try {
              JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            } catch {
              console.error("Firebase service-account JSON is invalid.");
              process.exit(1);
            }
          ' "$credential_file"

          export GOOGLE_APPLICATION_CREDENTIALS="$credential_file"
          firebase deploy --only hosting --project pubget-aaf27 --force
