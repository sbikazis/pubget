name: Deploy Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/deploy-firestore-rules.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: cd functions && npm ci

      # Rules reach production on every push to main: prove them against
      # the emulators (positive AND negative cases) before they ship.
      - name: Start Firestore + Storage emulators
        run: |
          firebase emulators:start --only firestore,storage > /tmp/emulators.log 2>&1 &
          ready=0
          for i in $(seq 1 90); do
            if curl -s http://127.0.0.1:8080/ >/dev/null 2>&1 && curl -s http://127.0.0.1:9199/ >/dev/null 2>&1; then
              ready=1
              echo "Emulators ready."
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Emulators failed to start."
            cat /tmp/emulators.log
            exit 1
          fi

      - name: Verify rules on emulator
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
        run: |
          cd functions
          node --test --test-concurrency=1 test/firestore.rules.test.js test/storage.rules.test.js

      - name: Deploy Firestore rules and indexes
        run: firebase deploy --only firestore:rules,firestore:indexes --project pubget-aaf27 --force --token "${{ secrets.FIREBASE_TOKEN }}"
