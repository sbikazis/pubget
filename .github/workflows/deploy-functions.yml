name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: cd functions && npm ci

      # npm can exit 0 after a partially materialized tree, which surfaces
      # later as an unrelated "Failed to find location of Firebase Functions
      # SDK" deploy error. Fail here instead.
      - name: Verify Functions SDK is installed
        run: cd functions && node -e "require.resolve('firebase-functions')"

      - name: Deploy to Firebase
        run: firebase deploy --only functions --force --debug --token "${{ secrets.FIREBASE_TOKEN }}"
