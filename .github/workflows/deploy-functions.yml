name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: cd functions && npm ci

      # npm can exit 0 after a partially materialized tree, which surfaces
      # later as an unrelated "Failed to find location of Firebase Functions
      # SDK" deploy error. Fail here instead.
      - name: Verify Functions SDK is installed
        run: cd functions && node -e "require.resolve('firebase-functions')"

      # Verification gate: syntax-check every function source and run the
      # full unit suite before anything reaches production. A deploy that
      # bypasses this is a deploy that can break the live app.
      - name: Syntax check
        run: cd functions && npm run check

      - name: Unit tests
        run: cd functions && npm test

      # Cloud Functions list/deploy occasionally returns HTTP 503 UNAVAILABLE.
      # Retry with backoff so a transient Google outage does not leave main
      # without the latest functions (e.g. after a rank-system merge).
      # GOOGLE_CLOUD_PROJECT / GCLOUD_PROJECT / FIREBASE_PROJECT are set
      # explicitly so the firebase-functions SDK resolves the project from
      # the environment instead of querying the GCE metadata server
      # (169.254.169.254), which is unreachable on CI runners and stalls
      # module load past the deploy discovery window.
      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GOOGLE_CLOUD_PROJECT: pubget-aaf27
          GCLOUD_PROJECT: pubget-aaf27
          FIREBASE_PROJECT: pubget-aaf27
        run: |
          set -euo pipefail
          attempts=5
          delay=20
          for i in $(seq 1 "$attempts"); do
            echo "Firebase functions deploy attempt ${i}/${attempts}..."
            if firebase deploy --only functions --force --debug --token "$FIREBASE_TOKEN"; then
              echo "Deploy succeeded on attempt ${i}."
              exit 0
            fi
            status=$?
            if [ "$i" -eq "$attempts" ]; then
              echo "Deploy failed after ${attempts} attempts (last exit ${status})."
              exit "$status"
            fi
            echo "Deploy attempt ${i} failed (exit ${status}). Waiting ${delay}s before retry..."
            sleep "$delay"
            delay=$((delay * 2))
          done
