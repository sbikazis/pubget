name: Kirari CI

on:
  push:
    branches: [feat/kirari-1-0-rebuild]
    paths:
      - 'lib/features/kirari/**'
      - 'lib/features/reels/**'
      - 'lib/features/audio/**'
      - 'lib/features/hashtags/**'
      - 'lib/features/home/**'
      - 'lib/features/social/**'
      - 'lib/app/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firebase.json'
      - '.github/workflows/kirari-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/kirari/**'
      - 'lib/features/reels/**'
      - 'lib/features/audio/**'
      - 'lib/features/hashtags/**'
      - 'lib/features/home/**'
      - 'lib/features/social/**'
      - 'lib/app/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firebase.json'
      - '.github/workflows/kirari-ci.yml'

concurrency:
  group: kirari-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze, tests and Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Flutter tests
        run: flutter test
      - name: Android debug build
        run: flutter build apk --debug

  functions:
    name: Functions checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Syntax and wiring checks
        working-directory: functions
        run: npm run check
      - name: Functions unit tests
        working-directory: functions
        run: npm test

  firebase-rules:
    name: Kirari Firestore and Storage emulator rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Kirari Firestore and Storage rules tests
        working-directory: functions
        run: npx firebase --config ../firebase.json emulators:exec --only firestore,storage --project demo-pubget-security "FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 node --test --test-name-pattern=Kirari test/firestore.rules.test.js && FIREBASE_STORAGE_EMULATOR_HOST=127.0.0.1:9199 FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 node --test --test-name-pattern=Kirari test/storage.rules.test.js"
