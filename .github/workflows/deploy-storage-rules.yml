name: Deploy Storage Rules

on:
  push:
    branches:
      - main
    paths:
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-storage-rules.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # firebase-tools 15.x refuses to run the emulators on JDK < 21.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # Downloading the emulator jars can exceed the emulator startup budget
      # inside emulators:exec, which fails with "Port 8080 ... was not active
      # within 60000ms". Warm the cache first so the exec only starts them.
      - name: Pre-fetch emulator binaries
        run: |
          node ./node_modules/firebase-tools/lib/bin/firebase.js setup:emulators:firestore
          node ./node_modules/firebase-tools/lib/bin/firebase.js setup:emulators:storage

      - name: Rules tests
        run: npm test

      - name: Deploy Storage rules
        run: firebase deploy --only storage --project pubget-aaf27 --force --token "${{ secrets.FIREBASE_TOKEN }}"
