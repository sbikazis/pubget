name: Flutter failure diagnostics

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/cloudflare-r2-media-backend]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run tests and summarize only failures
        shell: bash
        run: |
          set +e
          flutter test --exclude-tags golden --reporter json > /tmp/flutter-tests.jsonl 2>&1
          status=$?
          python3 - <<'PY'
          import json
          from collections import defaultdict
          errors = defaultdict(list)
          global_errors = []
          failed = []
          current = {}
          done = []
          for line in open('/tmp/flutter-tests.jsonl', encoding='utf-8', errors='replace'):
              try:
                  event = json.loads(line)
              except Exception:
                  continue
              kind = event.get('type')
              test = event.get('test', {})
              if kind == 'testStart':
                  current[test.get('id')] = test.get('name', '<unnamed>')
              elif kind in ('error', 'testError'):
                  test_id = event.get('testID')
                  message = event.get('error', event.get('message', 'unknown test error'))
                  if test_id is None:
                      global_errors.append(message)
                  else:
                      errors[test_id].append(message)
              elif kind == 'testDone' and event.get('result') != 'success' and not event.get('skipped', False):
                  test_id = event.get('testID')
                  failed.append((test_id, current.get(test_id, '<unknown>'), event.get('result')))
              elif kind == 'done':
                  done.append(event)
          print('FAILED_TEST_COUNT=', len(failed))
          print('GLOBAL_ERROR_COUNT=', len(global_errors))
          for message in global_errors[:30]:
              print('GLOBAL_ERROR:', str(message)[:2000])
          for test_id, name, result in failed[:100]:
              print('FAILED_TEST:', name, 'RESULT=', result, 'ID=', test_id)
              for message in errors.get(test_id, [])[:3]:
                  print('  ERROR:', str(message)[:1500])
          for test_id, messages in errors.items():
              if not any(row[0] == test_id for row in failed):
                  print('ERROR_EVENT_WITHOUT_FAILED_TEST:', current.get(test_id, '<unknown>'), 'ID=', test_id)
                  for message in messages[:3]:
                      print('  ERROR:', str(message)[:1500])
          print('DONE_EVENT=', done[-1] if done else 'missing')
          if not failed and not global_errors and not any(errors.values()):
              print('No explicit error event was parsed; last raw lines:')
              for line in open('/tmp/flutter-tests.jsonl', encoding='utf-8', errors='replace').readlines()[-40:]:
                  print(line[:1500].rstrip())
          PY
          exit "$status"

  web_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web and print concise compiler diagnostics
        shell: bash
        run: |
          set +e
          flutter build web --release > /tmp/flutter-web-build.log 2>&1
          status=$?
          grep -E '(^| )Error:|error:|Exception:|Target of URI|Failed to|Could not|Compilation failed|Error when reading' /tmp/flutter-web-build.log | tail -100 || tail -60 /tmp/flutter-web-build.log
          exit "$status"
