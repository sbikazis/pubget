name: Pubget APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/reels-rebirth-1

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this project is developed and locked against.
          # The floating `stable` channel moved to Flutter 3.47.x (Dart 3.13),
          # whose compiler rejects the pinned `pdfrx_engine` 0.1.13. Upgrading
          # past that requires `pdfrx` -> Dart >= 3.9, so bump this pin and the
          # dependency together, not one at a time.
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Setup keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=release.jks" >> android/key.properties

      - name: Clean build state
        run: flutter clean

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pubget-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/*.apk
